<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F">
<meta name="description" content="Umbix: habla con tus amigos, crea servidores y personaliza tu perfil gratis.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Umbix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600;700&family=Righteous&family=Pacifico&family=Fredoka:wght@600&family=Orbitron:wght@700&family=MedievalSharp&family=Press+Start+2P&family=Creepster&family=Chewy&family=VT323&family=Metal+Mania&family=Caveat:wght@700&display=swap">
<style>
/* Layout: app shell — server rail | channel/DM sidebar | conversation. Phones: rail+sidebar slide in as a drawer.
   Settings: full-screen overlay, section nav on the left, content on the right (one column with a back button on phones). */
:root{
  --bg:#0B0B0F; --bg2:#111117; --bg3:#17171F; --surface:#1E1E28; --line:#272732; --solid:#111117;
  --fg:#EDEDF2; --muted:#A3A3B2; --hover:rgba(255,255,255,.06);
  --page:var(--bg);
  --accent:#8B7CF6; --on-accent:#0B0B0F;
  --online:#3BA55D; --idle:#F0B232; --dnd:#ED4245; --offline:#80848E;
  --font-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --radius:12px; --msg-gap:14px;
  color-scheme:dark;
}
body[data-umbix="medianoche"]{--bg:#000;--bg2:#06060A;--bg3:#0B0B10;--surface:#15151C;--line:#202029;--solid:#06060A;--fg:#F2F2F5;--muted:#A3A3B3;--page:#000}
body[data-umbix="grafito"]{--bg:#1A1B1F;--bg2:#202126;--bg3:#26272D;--surface:#30313A;--line:#3A3B44;--solid:#202126;--fg:#ECECEF;--muted:#B3B4BD;--hover:rgba(255,255,255,.07);--page:#1A1B1F}
body[data-umbix="claro"]{--bg:#E6E6EE;--bg2:#F1F1F6;--bg3:#FFFFFF;--surface:#F1F1F6;--line:#DADAE3;--solid:#F1F1F6;--fg:#17171D;--muted:#565665;--hover:rgba(0,0,0,.05);--page:#E6E6EE;color-scheme:light}
/* Gradient themes: one gradient behind everything, panels are tinted glass over it */
body.grad{--bg:rgba(6,6,12,.52);--bg2:rgba(6,6,12,.40);--bg3:rgba(6,6,12,.24);--surface:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);--fg:#F4F4F8;--muted:#C4C4D2;--hover:rgba(255,255,255,.08)}
body[data-umbix="aurora"]{--page:linear-gradient(135deg,#2E1B63 0%,#1A2A6C 50%,#0E4552 100%);--solid:#1B1F45}
body[data-umbix="atardecer"]{--page:linear-gradient(135deg,#5A1838 0%,#8A3A22 55%,#2E1844 100%);--solid:#3A1A30}
body[data-umbix="oceano"]{--page:linear-gradient(160deg,#0B2545 0%,#13315C 50%,#0E5262 100%);--solid:#10294A}
body[data-umbix="bosque"]{--page:linear-gradient(150deg,#0F2E1F 0%,#24472F 50%,#13261F 100%);--solid:#152A20}
body[data-umbix="neon"]{--page:linear-gradient(135deg,#1A0B2E 0%,#46106A 45%,#0B3E66 100%);--solid:#22103C}
body[data-umbix="lavanda"]{--page:linear-gradient(135deg,#2C2244 0%,#47306A 50%,#1F2646 100%);--solid:#2C2445}
body.compacto{--msg-gap:6px}

html,body{height:100%}
input,select,textarea,button{box-sizing:border-box}
body{background:var(--page);background-attachment:fixed;color:var(--fg);font-family:var(--font-body);font-size:15px;overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:72px 248px minmax(0,1fr);height:100%}

/* Rail */
.rail{background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:12px;overflow-y:auto}
.rail-btn{width:48px;height:48px;border-radius:16px;border:0;background:var(--surface);display:grid;place-items:center;padding:0;
  font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--fg);position:relative;transition:border-radius .15s,background .15s}
.rail-btn:hover{border-radius:14px}
.rail-btn.on{background:var(--accent);color:var(--on-accent)}
.rail-btn.home{background:none;overflow:visible}
.rail-btn.home svg{width:48px;height:48px;display:block}
.rail-btn.on::before{content:"";position:absolute;left:-12px;width:4px;height:32px;border-radius:0 4px 4px 0;background:var(--fg)}
.rail-sep{width:32px;height:2px;border-radius:2px;background:var(--line)}
.rail-add{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-size:24px;font-weight:400}

/* Sidebar */
.side{background:var(--bg2);display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.side-head{height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-weight:700;font-size:15px;gap:8px;flex:none}
.side-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-list{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.side-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 8px 6px}
.item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;border:0;background:none;text-align:left;color:var(--muted);width:100%;min-height:40px}
.item:hover{background:var(--hover);color:var(--fg)}
.item.on{background:var(--surface);color:var(--fg)}
.item .hash{font-size:19px;width:20px;text-align:center;opacity:.8;display:grid;place-items:center}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.badge{background:var(--dnd);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}

.me-bar{flex:none;display:flex;align-items:center;gap:6px;padding:8px;background:var(--bg);border-top:1px solid var(--line)}
.me-bar .who{flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;gap:10px;align-items:center;padding:4px;border-radius:8px}
.me-bar .who:hover{background:var(--hover)}
.who-txt{min-width:0;line-height:1.2}
.who-txt b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-txt small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none;padding:0}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn svg{width:20px;height:20px}
.gear-btn svg{transition:transform .35s ease}
.gear-btn:hover svg{transform:rotate(60deg)}

/* Avatars */
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff;background-size:cover;background-position:center}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:34%;height:34%;min-width:10px;min-height:10px;border-radius:50%;border:3px solid var(--solid)}
.dot.online{background:var(--online)}.dot.idle{background:var(--idle)}.dot.dnd{background:var(--dnd)}.dot.offline{background:var(--offline)}

/* Main */
.main{background:var(--bg3);display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:1px solid var(--line)}
.top h1{font-family:var(--font-display);font-size:16px;margin:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top .spacer{flex:1}
.menu-btn{display:none}
.demo-tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 7px;white-space:nowrap}

.msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:var(--msg-gap)}
.welcome{padding:24px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.welcome h2{font-family:var(--font-display);font-size:26px;margin:0 0 6px;text-wrap:balance}
.welcome p{margin:0;color:var(--muted);max-width:60ch}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .body{min-width:0;flex:1}
.msg .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.msg .meta button{border:0;background:none;padding:0;font-weight:700;color:var(--fg)}
.msg .meta button:hover{text-decoration:underline}
.msg time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.msg p{margin:2px 0 0;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.typing{color:var(--muted);font-size:13px;padding:0 16px 6px;min-height:20px}

.composer{flex:none;padding:0 16px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.composer form{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 6px 6px 14px;align-items:center}
.composer input{flex:1;min-width:0;border:0;background:none;outline:none;padding:8px 0;font-size:15px}
.send{border:0;border-radius:9px;background:var(--accent);color:var(--on-accent);width:40px;height:40px;display:grid;place-items:center;flex:none}
.send svg{width:18px;height:18px}

/* Friends */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:8px;font-weight:600;min-height:36px}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab.on{background:var(--surface);color:var(--fg)}
.tab.add{background:var(--accent);color:var(--on-accent)}
.panel{flex:1;overflow-y:auto;padding:16px 16px 24px}
.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid var(--line)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block}
.row .txt small{color:var(--muted)}
.row-actions{display:flex;gap:6px}
.round{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center}
.round:hover{color:var(--fg)}
.round.ok:hover{color:var(--online)} .round.no:hover{color:var(--dnd)}
.round svg{width:18px;height:18px}
.empty{color:var(--muted);padding:32px 8px;text-align:center}
.add-box{max-width:620px}
.add-box p{color:var(--muted);margin:0 0 12px}
.add-form{display:flex;gap:8px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
.add-form input{flex:1;min-width:160px;border:0;background:none;outline:none;padding:8px}
.btn{border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;position:relative}
.btn.ghost{background:var(--surface);color:var(--fg)}
.btn.danger{background:transparent;color:var(--dnd);border:1px solid var(--dnd)}
.btn:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.note{margin-top:10px;font-size:14px}
.note.good{color:var(--online)} .note.bad{color:var(--dnd)}

/* Small modals */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--solid);border:1px solid var(--line);border-radius:16px;width:min(440px,100%);max-height:min(88vh,720px);display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:8px;padding:14px 14px 14px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-family:var(--font-display);font-size:18px;margin:0;flex:1}
.modal-body{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label:not(.btn),.field .lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input:not([type=color]):not([type=file]):not([type=checkbox]):not([type=radio]):not([type=range]),.field textarea,.field select{box-sizing:border-box;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px}
.hint{color:var(--muted);font-size:13px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0;background-size:cover}
.sw.wide{width:56px;border-radius:10px}
.sw.on{border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--solid)}
.sw-custom{width:44px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.theme-card{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:none;text-align:left}
.theme-card.on{border-color:var(--accent)}
.theme-card .prev{height:64px;display:flex;gap:4px;padding:8px}
.theme-card .prev i{display:block;border-radius:5px}
.theme-card span{display:block;padding:8px 10px;font-weight:600;font-size:14px;background:var(--solid)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.toggle b{display:block;font-weight:600}
.toggle small{color:var(--muted)}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* Profile card */
.pcard{background:var(--solid);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pcard .banner{height:100px;background-size:cover;background-position:center}
.pcard .inner{padding:0 16px 16px}
.pcard .av{border:5px solid var(--solid)}
.pcard .av-wrap{margin-top:-42px;display:block;width:max-content}
.pcard .av .dot{border-color:var(--solid)}
.pcard h4{font-family:var(--font-display);font-size:20px;margin:8px 0 0}
.pcard .handle{color:var(--muted);font-size:14px}
.pcard .status-txt{margin-top:8px;font-size:14px}
.pcard .about{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.pcard .about b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pcard .about p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}

/* Settings overlay */
.settings{position:fixed;inset:0;z-index:50;background:var(--page);background-attachment:fixed;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.set-nav{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:16px 12px 24px;display:flex;flex-direction:column;gap:2px}
.set-me{display:flex;gap:12px;align-items:center;padding:4px 6px 14px}
.set-me .txt{min-width:0}
.set-me b{display:block;font-family:var(--font-display);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-me button{border:0;background:none;padding:0;color:var(--muted);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.set-me button:hover{color:var(--fg)}
.set-me button svg{width:14px;height:14px}
.set-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px;margin:0 2px 10px}
.set-search svg{width:18px;height:18px;color:var(--muted);flex:none}
.set-search input{border:0;background:none;outline:none;padding:10px 0;flex:1;min-width:0}
.nav-item{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--muted);text-align:left;padding:9px 10px;border-radius:9px;font-weight:600;min-height:42px;width:100%}
.nav-item svg{width:20px;height:20px;flex:none}
.nav-item:hover{background:var(--hover);color:var(--fg)}
.nav-item.on{background:var(--surface);color:var(--fg)}
.nav-item.red{color:var(--dnd)}
.nav-sub{border:0;background:none;color:var(--muted);text-align:left;padding:7px 10px 7px 20px;margin-left:20px;border-left:2px solid var(--line);font-size:14.5px;min-height:36px}
.nav-sub:hover{color:var(--fg)}
.nav-sub.on{color:var(--fg);border-left-color:var(--fg)}
.nav-label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:16px 10px 6px}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}
.set-main{position:relative;overflow-y:auto;background:var(--bg3);min-width:0}
.set-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:56px;padding:0 10px 0 16px;background:var(--solid);border-bottom:1px solid var(--line)}
.set-top h2{margin:0;font-size:16px;font-family:var(--font-display);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-top .back{display:none}
.set-content{max-width:780px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.set-content h3{font-family:var(--font-display);font-size:24px;margin:8px 0 0;text-wrap:balance}
.set-content > p.lead{color:var(--muted);margin:-12px 0 0;max-width:60ch}
.acc-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:52px}
.acc-row .k{font-weight:600;flex:1;min-width:140px}
.acc-row .v{color:var(--fg);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.acc-row .v .link{border:0;background:none;color:var(--accent);padding:0;font-weight:600}
.acc-row .v .link:hover{text-decoration:underline}
.acc-row .v input{background:var(--bg);border:1px solid var(--accent);border-radius:10px;padding:9px 12px;outline:none;min-width:0;width:220px;max-width:100%}
.acc-btn{border:0;border-radius:10px;background:var(--surface);color:var(--fg);font-weight:600;padding:10px 20px;min-height:44px;min-width:88px}
.acc-btn:hover{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line)}
.acc-btn.pri{background:var(--accent);color:var(--on-accent)}
.chev{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-weight:600;padding:8px 4px;min-height:44px}
.chev svg{width:18px;height:18px}
.divider{height:1px;background:var(--line);margin:8px 0}
.prof-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.prof-grid .preview-col{position:sticky;top:76px}
.icons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.icon-card{border:2px solid var(--line);border-radius:16px;background:var(--bg2);padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px}
.icon-card svg{width:72px;height:72px}
.icon-card.on{border-color:var(--accent)}
.home-preview{display:flex;gap:18px;align-items:flex-end;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;flex-wrap:wrap}
.home-preview .app-ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.home-preview svg{display:block}
.tier{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bg2);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tier .txt{flex:1;min-width:200px}
.tier b{font-family:var(--font-display)}
.tier small{color:var(--muted);display:block;margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#0B0B0F;padding:10px 16px;border-radius:10px;font-weight:600;z-index:70;max-width:calc(100% - 32px)}
body[data-umbix="claro"] .toast{color:#fff}
.scrim-drawer{display:none}

/* ---------- Motion ---------- */
:root{--dur:200ms;--ease:cubic-bezier(.2,.7,.2,1);--pop:1.05;--speed:1;--enter-y:6px;--enter-scale:1;--enter-blur:0px}

body[data-anim="minimal"]{--dur:200ms;--ease:cubic-bezier(.2,.7,.2,1);--pop:1.05;--enter-y:6px;--enter-scale:1;--enter-blur:0px}
body[data-anim="liquid"]{--dur:560ms;--ease:cubic-bezier(.34,1.56,.64,1);--pop:1.09;--enter-y:10px;--enter-scale:.93;--enter-blur:8px}
body[data-anim="rebote"]{--dur:600ms;--ease:cubic-bezier(.68,-.55,.27,1.55);--pop:1.12;--enter-y:20px;--enter-scale:.88;--enter-blur:0px}
body[data-anim="ninguna"]{--dur:0ms;--pop:1;--enter-y:0px;--enter-scale:1;--enter-blur:0px}
body.no-pop{--pop:1}

.rail-btn{transition:transform var(--t) var(--ease),border-radius var(--t) var(--ease),background-color var(--t) ease,box-shadow var(--t) ease}
.rail-btn:hover,.rail-btn:active{transform:scale(var(--pop))}
.msg{border-radius:12px;padding:6px 8px;margin:0 -8px;transform-origin:left center;transition:transform var(--t) var(--ease),background-color var(--t) ease}
.msg:hover,.msg:active{transform:scale(calc(1 + (var(--pop) - 1) * .3));background:var(--hover)}
.item,.tab,.nav-item,.nav-sub,.round,.btn,.acc-btn,.sw,.theme-card,.icon-card,.anim-card,.send{transition:background-color var(--t) ease,color var(--t) ease,transform var(--t) var(--ease),border-color var(--t) ease,box-shadow var(--t) ease}
.btn:active,.acc-btn:active,.send:active,.round:active,.sw:active,.theme-card:active,.icon-card:active,.anim-card:active{transform:scale(.96)}
.sw:hover,.icon-card:hover,.theme-card:hover,.anim-card:hover{transform:translateY(-2px)}
.drawer{transition:transform var(--t) var(--ease)}

.msg.in{animation:msgIn var(--t) var(--ease) both;animation-delay:calc(var(--i,0) * 80ms)}
.view-in > *{animation:viewIn calc(var(--t) * 1.1) var(--ease) both}
.view-in > *:nth-child(2){animation-delay:calc(var(--t) * .08)}
.view-in > *:nth-child(3){animation-delay:calc(var(--t) * .16)}
.scrim{animation:fadeIn var(--t) ease both}
.modal{animation:popIn var(--t) var(--ease) both}
.settings{animation:setIn var(--t) var(--ease) both}
.sec-in{animation:viewIn var(--t) var(--ease) both}
.toast{animation:toastIn var(--t) var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(var(--enter-y)) scale(var(--enter-scale));filter:blur(var(--enter-blur))}to{opacity:1;transform:none;filter:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
@keyframes setIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}

/* Liquid glass: living background + frosted panels */
/* Living background (blobs): built from the user's settings */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
body.blobs .ambient{display:block}
.ambient i{position:absolute;width:calc(46vmax * var(--bs,1));height:calc(46vmax * var(--bs,1));border-radius:50%;filter:blur(70px);opacity:var(--bo,.5);transform:translate(-50%,-50%);
  animation:drift calc(var(--bd,22s) * var(--speed)) ease-in-out infinite alternate}
body.blobs-still .ambient i{animation:none}
@keyframes drift{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(calc(-50% + 8vw),calc(-50% + 6vh)) scale(1.15)}100%{transform:translate(calc(-50% - 6vw),calc(-50% + 10vh)) scale(.92)}}
.app{position:relative;z-index:1}
/* Scroll fixes: rows never grow past the screen; hover "inflate" never creates sideways scrollbars */
.app,.settings{box-sizing:border-box;grid-template-rows:minmax(0,1fr)}
.rail,.side,.main,.set-nav,.set-main{min-height:0}
.msgs,.panel,.side-list,.rail,.set-main,.set-nav,.modal-body{overflow-x:hidden;overscroll-behavior:contain}
.rail{padding-inline:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
/* Solid styles with blobs on: let a little of the background through */
body.blobs:not(.glass) .rail{background:color-mix(in srgb,var(--bg) 78%,transparent)}
body.blobs:not(.glass) .side{background:color-mix(in srgb,var(--bg2) 80%,transparent)}
body.blobs:not(.glass) .main{background:color-mix(in srgb,var(--bg3) 82%,transparent)}

/* Liquid Glass (iOS-style): floating rounded glass panels, bright rims, specular light that follows the pointer */
:root{--glass-tint:rgba(255,255,255,.055);--glass-rim:rgba(255,255,255,.30);--glass-edge:rgba(255,255,255,.14);--glass-shadow:0 12px 40px rgba(0,0,0,.30)}
body[data-umbix="claro"]{--glass-tint:rgba(255,255,255,.48);--glass-rim:rgba(255,255,255,.95);--glass-edge:rgba(255,255,255,.75);--glass-shadow:0 12px 40px rgba(40,40,80,.14)}
body.glass .app{padding:10px;gap:10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
body.glass .rail,body.glass .side,body.glass .main,body.glass .set-nav,body.glass .set-main,body.glass .modal{
  border-radius:28px;border:1px solid var(--glass-edge);
  background:linear-gradient(140deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 72%,rgba(255,255,255,.05) 100%),var(--glass-tint);
  backdrop-filter:blur(var(--lg-blur,26px)) saturate(185%);-webkit-backdrop-filter:blur(var(--lg-blur,26px)) saturate(185%);
  box-shadow:inset 1.5px 1.5px 0 var(--glass-rim),inset -1px -1px 0 rgba(255,255,255,.07),var(--glass-shadow);overflow:hidden}
/* Animated sheen: a soft band of light sweeps across the glass */
body.glass.lg-sheen .rail,body.glass.lg-sheen .side,body.glass.lg-sheen .main,body.glass.lg-sheen .set-nav,body.glass.lg-sheen .set-main{
  background-image:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.10) 49%,rgba(255,255,255,.03) 53%,transparent 60%),linear-gradient(140deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 72%,rgba(255,255,255,.05) 100%);
  background-color:var(--glass-tint);background-size:320% 100%,100% 100%;background-repeat:no-repeat;
  animation:sheen calc(11s * var(--speed)) ease-in-out infinite}

body.glass .rail-btn,body.glass .round,body.glass .btn,body.glass .acc-btn,body.glass .send,body.glass .anim-card,body.glass .icon-card{position:relative;overflow:hidden;isolation:isolate}

body.glass .btn:not(.ghost):not(.danger),body.glass .rail-btn.on,body.glass .send,body.glass .acc-btn.pri,body.glass .tab.add{background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%),var(--accent)}
body.glass .rail-btn.on{box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.55),0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent),0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent)}

  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;opacity:0;transition:opacity var(--t) ease;
  background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.45),rgba(255,255,255,0) 60%)}

/* Animation settings */
.anim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.anim-card{border:2px solid var(--line);border-radius:14px;background:var(--bg2);text-align:left;padding:14px;display:flex;flex-direction:column;gap:4px}

.range-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.tpl-btn{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;min-height:56px}
.tpl-btn:hover{background:var(--hover)}
.tpl-btn .tpl-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--surface);flex:none}
.tpl-btn .go{margin-left:auto;color:var(--muted)}
.tpl-btn .go svg{width:18px;height:18px}
.modal-foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg2)}
.modal-foot b{font-family:var(--font-display)}
.icon-up{align-self:center;width:88px;height:88px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;cursor:pointer;color:var(--muted);text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;position:relative;background-size:cover;background-position:center}
.icon-up.has{border-style:solid;border-color:transparent}
.icon-up:focus-within{outline:2px solid var(--accent);outline-offset:3px}
.icon-up .plus{position:absolute;right:-2px;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:18px;font-weight:700}
.step-nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link-btn{border:0;background:none;color:var(--fg);font-weight:600;padding:8px 4px;min-height:44px}
.link-btn:hover{text-decoration:underline}
.srv-ic{border-radius:30%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff;background-size:cover;background-position:center;flex:none}
.ss-general{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.ss-icon-col{display:flex;flex-direction:column;align-items:center;gap:8px}
.srv-icon-up{position:relative;cursor:pointer;border-radius:30%}
.srv-icon-up:focus-within{outline:2px solid var(--accent);outline-offset:3px}
.srv-icon-up .up-badge{position:absolute;right:-4px;top:-4px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg3)}
.srv-banner-prev{height:110px;border-radius:12px;border:1px solid var(--line);background-size:cover;background-position:center}
.tag-preview{display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px}
.tag-preview .who{display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
.tag-styles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag-styles button{border:2px solid transparent;background:none;padding:4px;border-radius:12px}
.tag-styles button.on{border-color:var(--accent)}
.emoji-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-card{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--bg2);border-radius:12px;padding:12px 14px}
.opt-card .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px;display:grid;place-items:center}
.opt-card.on{border-color:var(--accent)}
.opt-card.on .dot{border-color:var(--accent)}
.opt-card.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.opt-card b{display:block}
.opt-card small{color:var(--muted);line-height:1.4}
.roles-wrap{display:grid;grid-template-columns:minmax(180px,240px) minmax(0,1fr);gap:16px;align-items:start}
.role-list{display:flex;flex-direction:column;gap:4px}
.role-row{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--fg);padding:9px 10px;border-radius:9px;text-align:left;width:100%;min-height:42px}
.role-row:hover{background:var(--hover)}
.role-row.on{background:var(--surface)}
.role-row .rd{width:12px;height:12px;border-radius:50%;flex:none}
.role-row small{margin-left:auto;color:var(--muted)}
.role-edit{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bg2);display:flex;flex-direction:column;gap:14px;min-width:0}
.role-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 8px;font-size:12.5px;background:var(--bg)}
.role-chip .rd{width:9px;height:9px;border-radius:50%}
.role-chip button{border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%;padding:0;display:grid;place-items:center}
.role-chip button svg{width:12px;height:12px}
.mem-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);flex-wrap:wrap}
.mem-row .txt{flex:1;min-width:160px}
.mem-row .chips{margin-top:4px}
.mem-row select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.emo{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 10px;background:var(--bg2)}
.emo img{width:32px;height:32px;object-fit:contain}
.emo input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.inv-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 4px;border-top:1px solid var(--line)}
.inv-row code{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;user-select:all}
.inv-row .txt{flex:1;min-width:160px;color:var(--muted);font-size:13px}
.audit-row{display:flex;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.audit-row .txt{flex:1;min-width:0}
.audit-row small{color:var(--muted)}
.req{display:flex;align-items:center;gap:10px;padding:8px 0}
.req .ok{color:var(--online)} .req .no{color:var(--dnd)}
.danger-zone{border:1px solid var(--dnd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
body.glass .tpl-btn,body.glass .opt-card,body.glass .role-edit,body.glass .emo,body.glass .tag-preview{background:var(--glass-tint);border-color:var(--glass-edge);box-shadow:inset 1px 1px 0 var(--glass-rim)}
body.glass .tpl-btn,body.glass .opt-card{border-radius:18px}
body.glass .modal-foot{background:transparent}
@media (max-width:640px){ .roles-wrap{grid-template-columns:minmax(0,1fr)} }
.badge-list{display:flex;flex-direction:column;gap:6px}
.b-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 4px;position:relative;transition:box-shadow var(--t) ease,background-color var(--t) ease}
.b-row .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-row .pos{width:22px;text-align:center;color:var(--muted);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.b-row.off .badge-i,.b-row.off .nm{opacity:.4}
.b-row.off .pos{visibility:hidden}
.drag{width:34px;height:40px;border:0;background:none;color:var(--muted);cursor:grab;touch-action:none;display:grid;place-items:center;padding:0;border-radius:8px}
.drag:hover{color:var(--fg);background:var(--hover)}
.drag svg{width:18px;height:18px}
.b-row.dragging{z-index:5;box-shadow:0 14px 34px rgba(0,0,0,.38);cursor:grabbing;background:var(--surface)}
.b-row.dragging .drag{cursor:grabbing}
.b-show{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.b-show input{width:20px;height:20px;accent-color:var(--accent)}
.b-arrows{display:flex;gap:4px}
.b-arrows button{width:32px;height:32px;padding:0;display:grid;place-items:center}
.b-arrows button:disabled{opacity:.3;cursor:default}
body.glass .b-row{background:var(--glass-tint);border-color:var(--glass-edge);box-shadow:inset 1px 1px 0 var(--glass-rim);border-radius:18px}
body.glass .b-row.dragging{box-shadow:inset 1.5px 1.5px 0 var(--glass-rim),0 16px 40px rgba(0,0,0,.4),0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
@media (max-width:520px){ .b-row .b-show span{display:none} }
.picker-list{max-height:min(46vh,380px);overflow-y:auto;overflow-x:hidden}
body.glass .mini-btn,body.glass .star{background:var(--glass-tint);box-shadow:inset 1px 1px 0 var(--glass-rim)}
.app-card{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:16px;background:var(--bg2);padding:16px}
.app-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.app-logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;flex:none}
.app-logo svg{width:24px;height:24px}
.app-head .txt{flex:1;min-width:150px}
.app-head .txt b{display:block;font-size:16px}
.app-head .txt small{color:var(--muted)}
.pill-ok{display:inline-flex;align-items:center;gap:6px;color:var(--online);font-weight:700;font-size:13px}
.pill-ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--online)}
.player{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.player .now{flex:1;min-width:180px;font-size:14px;color:var(--muted)}
.player .now b{color:var(--fg)}
.soon-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.soon{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg2);color:var(--muted)}
.soon b{color:var(--fg);display:block}
.soon .app-logo{width:36px;height:36px;border-radius:10px;font-size:14px}
body.glass .app-card,body.glass .soon{background:var(--glass-tint);border-color:var(--glass-edge);box-shadow:inset 1px 1px 0 var(--glass-rim);border-radius:22px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.modal.wide{width:min(420px,100%)}
.modal.wide .modal-body{padding:0}
.modal.wide .pcard{border:0;border-radius:0}
body.glass .modal.wide .pcard{background:transparent}
body.glass .modal.wide .pcard .av{border-color:color-mix(in srgb,var(--solid) 80%,transparent)}

/* ---------- Thought bubble ("¿Qué estás pensando?") ---------- */
.av-wrap{position:relative;display:inline-block;flex:none}
.thought{position:absolute;left:calc(100% - 6px);bottom:calc(100% - 18px);z-index:3;display:flex;align-items:center;gap:6px;
  background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:7px 12px;font-size:13.5px;line-height:1.25;
  max-width:min(220px,58vw);width:max-content;box-shadow:0 6px 18px rgba(0,0,0,.22);transform-origin:0% 100%;font-weight:500}
.thought .tx{overflow:hidden;min-width:0;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.thought img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none}
.thought .em{font-size:16px;flex:none}
.thought.mini img{width:16px;height:16px;border-radius:4px}
.thought-chip img{width:16px;height:16px;border-radius:4px;object-fit:cover}
.thought::before,.thought::after{content:"";position:absolute;border-radius:50%;background:inherit;border:inherit;box-shadow:none}
.thought::before{width:10px;height:10px;left:-4px;bottom:-7px}
.thought::after{width:5px;height:5px;left:-11px;bottom:-13px}
.thought.mini{padding:2px 6px;font-size:12px;left:calc(100% - 12px);bottom:calc(100% - 12px);border-radius:12px}
.thought.mini::before{width:6px;height:6px;left:-2px;bottom:-4px}.thought.mini::after{display:none}
.pcard .av-wrap .thought{left:calc(100% + 2px);bottom:calc(100% - 46px)}
.thought-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;margin-top:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12.5px;color:var(--fg)}
.thought-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* per style */
body[data-anim="minimal"] .thought,body[data-anim="minimal"] .thought-chip{animation:thoughtFade var(--t) var(--ease) both}
body[data-anim="rebote"] .thought{animation:thoughtPop var(--t) var(--ease) both,wiggle calc(4s * var(--speed)) ease-in-out calc(var(--t) + 1s) infinite}
body[data-anim="rebote"] .thought-chip{animation:thoughtPop var(--t) var(--ease) both}
body.glass .thought,body.glass .thought-chip{background:var(--glass-tint);border:1px solid var(--glass-edge);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:inset 1.5px 1.5px 0 var(--glass-rim),0 8px 22px rgba(0,0,0,.25)}
body.glass .pcard .thought,body.glass .anim-prev .thought{background:linear-gradient(140deg,rgba(255,255,255,.18),rgba(255,255,255,.04)),color-mix(in srgb,var(--solid) 60%,transparent)}
body.glass .thought{animation:thoughtPop var(--t) var(--ease) both,floaty calc(3.4s * var(--speed)) ease-in-out var(--t) infinite alternate}
body.glass .thought-chip{animation:thoughtPop var(--t) var(--ease) both}
body:not(.glass) .thought.still{animation:none}
body.glass .thought.still{animation:floaty calc(3.4s * var(--speed)) ease-in-out infinite alternate}
@keyframes thoughtFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes thoughtPop{from{opacity:0;transform:translate(-14px,12px) scale(.3)}to{opacity:1;transform:none}}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-4px) rotate(-1deg)}}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-5deg) scale(1.04)}92%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
/* Bio formatting */
.bio-md a{color:var(--accent)}
.bio-md b{font-weight:700}
.count{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap}
.emoji-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:19px;display:grid;place-items:center;padding:0}
.emoji-btn.on{border-color:var(--accent);background:var(--surface)}
body.glass .emoji-btn{border-radius:50%;background:var(--glass-tint);box-shadow:inset 1px 1px 0 var(--glass-rim)}
/* DM layout with profile panel */
.dm-body{flex:1;display:flex;min-height:0}
.dm-chat{flex:1;display:flex;flex-direction:column;min-width:0}
.dm-side{width:300px;flex:none;overflow-y:auto;overflow-x:hidden;border-left:1px solid var(--line);padding:16px;padding-top:40px}
.dm-side .pcard{border-radius:18px}
body.glass .dm-side{border-left-color:rgba(255,255,255,.08)}
body:not(.dm-panel) .dm-side{display:none}
.dm-side .thought,.preview-col .thought{max-width:150px}
.top .icon-btn.on{color:var(--accent)}
@media (max-width:1100px){ .dm-side{display:none} .dm-toggle{display:none} }

/* ---------- Voice channels ---------- */
.vusers{display:flex;flex-direction:column;gap:2px;margin:0 0 4px 28px}
.vuser{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:8px;font-size:13.5px;color:var(--muted);min-height:30px}
.vuser .av{transition:box-shadow 120ms ease}
.vuser.speaking .av{box-shadow:0 0 0 2px var(--online)}
.vuser .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vuser .ics{display:flex;gap:3px;align-items:center;color:var(--muted)}
.vuser .ics svg{width:14px;height:14px}
.live{display:inline-flex;align-items:center;background:#E5484D;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.06em;border-radius:5px;padding:2px 5px;line-height:1}
.item.voice.on{background:var(--surface);color:var(--fg)}
.vc-panel{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 10px 8px;border-top:1px solid var(--line);background:var(--bg)}
.vc-row{display:flex;align-items:center;gap:8px}
.vc-status{flex:1;min-width:0}
.vc-status b{display:flex;align-items:center;gap:6px;color:var(--online);font-size:14px}
.vc-status b svg{width:16px;height:16px}
.vc-status small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc-btns{display:flex;gap:6px}
.vc-btns .icon-btn{background:var(--surface)}
.vc-btns .icon-btn.on{color:var(--accent)}
.icon-btn.off{color:var(--dnd)}
body.glass .vc-panel{margin:8px 8px 0;border-radius:20px;border:1px solid var(--glass-edge);background:var(--glass-tint);box-shadow:inset 1px 1px 0 var(--glass-rim)}
.voice-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:#08080C;position:relative}
body[data-umbix="claro"] .voice-wrap{background:#1A1A22}
.voice-stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-content:center}
.voice-stage.focus{grid-template-columns:1fr;align-content:start}
.vtile{position:relative;aspect-ratio:16/9;max-width:100%;border:0;border-radius:14px;overflow:hidden;display:grid;place-items:center;color:#fff;padding:0;
  background:var(--tile,#22222C);transition:box-shadow 120ms ease,transform var(--t) var(--ease)}
.vtile:hover{transform:scale(calc(1 + (var(--pop) - 1) * .4))}
.vtile.speaking{box-shadow:inset 0 0 0 3px var(--online)}
.vtile .vt-av .av{box-shadow:0 6px 24px rgba(0,0,0,.35)}
.vtile.speaking .vt-av .av{box-shadow:0 0 0 4px var(--online),0 6px 24px rgba(0,0,0,.35)}
.vt-name{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700;max-width:calc(100% - 20px)}
.vt-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt-name svg{width:14px;height:14px;color:#ff8a8a;flex:none}
.vtile .live{position:absolute;top:10px;left:10px;font-size:12px;padding:4px 7px}
.vtile .watch{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700}
.vtile.big{max-height:calc(100vh - 260px);width:100%;aspect-ratio:16/9}
.focus-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.focus-strip .vtile{width:180px;flex:none}
.vtile video{width:100%;height:100%;object-fit:contain;background:#000}
/* mock stream (prototype) */
.mock{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center}
.mock .scene{position:absolute;inset:-20%;background:radial-gradient(circle at 30% 30%,hsl(var(--h) 80% 55% / .9),transparent 45%),radial-gradient(circle at 70% 60%,hsl(calc(var(--h) + 60) 80% 50% / .8),transparent 50%),linear-gradient(135deg,hsl(var(--h) 50% 18%),hsl(calc(var(--h) + 40) 60% 10%));
  animation:scene calc(9s * var(--speed)) ease-in-out infinite alternate}
@keyframes scene{from{transform:translate(-4%,-3%) scale(1)}to{transform:translate(4%,3%) scale(1.1)}}
.mock .hud{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-shadow:0 2px 8px rgba(0,0,0,.6);font-weight:700}
.mock .hud .game{width:64px;height:64px;border-radius:16px;font-size:22px}
.mock.screen .scene{background:linear-gradient(160deg,#1C2B4A,#2E1B63)}
.mock .win{position:absolute;border-radius:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(4px)}
.mock .win::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:rgba(255,255,255,.18);border-radius:8px 8px 0 0}
.mock .cursor{position:absolute;width:12px;height:12px;border-left:2px solid #fff;border-top:2px solid #fff;transform:rotate(-20deg);animation:cur calc(6s * var(--speed)) ease-in-out infinite alternate}
@keyframes cur{0%{left:30%;top:40%}50%{left:62%;top:30%}100%{left:48%;top:66%}}
.voice-bar{flex:none;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 16px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.vbtn{width:52px;height:52px;border-radius:50%;border:0;background:#2A2A35;color:#fff;display:grid;place-items:center;transition:transform var(--t) var(--ease),background-color var(--t) ease}
.vbtn svg{width:22px;height:22px}
.vbtn:hover{background:#3A3A48}
.vbtn.off{background:#fff;color:#C2413C}
.vbtn.on{background:var(--accent);color:var(--on-accent)}
.vbtn.leave{background:#E5484D}
.vbtn.leave:hover{background:#C2413C}
.vbtn.talk{width:auto;padding:0 18px;border-radius:999px;font-weight:700;gap:8px;display:inline-flex;align-items:center}
.vbtn.talk.active{background:var(--online);color:#05210F}

body.glass .voice-wrap{background:rgba(0,0,0,.35)}
body.glass .vtile{box-shadow:inset 1px 1px 0 rgba(255,255,255,.18)}
body.glass .vtile.speaking{box-shadow:inset 0 0 0 3px var(--online),0 0 24px rgba(59,165,93,.35)}
.voice-hint{text-align:center;color:#B9B9C6;font-size:13px;padding:0 16px}
.voice-hint kbd{background:#2A2A35;border-radius:5px;padding:1px 6px;font-family:inherit;font-weight:700;color:#fff}
/* share picker */
.share-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.share-opt{border:2px solid var(--line);border-radius:12px;background:var(--bg2);padding:0;overflow:hidden;text-align:left}

/* meters */
.meter{position:relative;height:12px;border-radius:6px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.meter .lvl{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--online),#F0B232 75%,#E5484D);transition:width 60ms linear}
.meter .thr{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--fg);border-radius:2px}
.kbd-bind{min-width:120px;font-weight:700;letter-spacing:.04em}
.kbd-bind.listening{outline:2px solid var(--accent);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.55}}
/* accessibility */
body.rm *,body.rm *::before,body.rm *::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important}
body.hc{--muted:#D4D4DE;--line:#5A5A6E}
body.hc[data-umbix="claro"]{--muted:#2C2C36;--line:#8A8A9A}
body.ul a,body.ul .linkbtn,body.ul .link-btn{text-decoration:underline}
.modal.wide-share{width:min(640px,100%)}
.me-bar .icon-btn{width:34px;height:34px}
/* ---------- Channel types ---------- */
.item .hash svg{width:18px;height:18px}
.ch-row{position:relative}
.ch-row .item{padding-right:34px}
.ch-gear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px!important;height:28px!important;opacity:0}
.ch-gear svg{width:15px!important;height:15px!important}
.ch-row:hover .ch-gear,.ch-gear:focus-visible,.ch-row .item.on+.ch-gear{opacity:1}
@media (hover:none){ .ch-gear{opacity:.7} }
.ch-lock{display:grid;color:var(--muted)} .ch-lock svg{width:13px;height:13px}
.cat-add{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;width:28px;height:28px;border-radius:6px;padding:0}
.cat-add:hover{color:var(--fg);background:var(--hover)}
.opt-card.ch-type{align-items:center}
.ct-ic{width:36px;height:36px;border-radius:10px;background:var(--surface);display:grid;place-items:center;flex:none}
.ct-ic svg{width:20px;height:20px}
.prefix-input{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.prefix-input:focus-within{border-color:var(--accent)}
.prefix-input span{display:grid;color:var(--muted)} .prefix-input span svg{width:18px;height:18px}
.prefix-input input{flex:1;min-width:0;border:0!important;background:none!important;padding:10px 0!important;outline:none}
.locked{display:flex;align-items:center;gap:8px;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;color:var(--muted);font-size:14px}
.forum-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.posts{display:flex;flex-direction:column;gap:10px}
.post-card{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:14px;color:var(--fg)}
.post-card:hover{background:var(--hover)}
.pc-title{font-family:var(--font-display);font-weight:700;font-size:16px;overflow-wrap:anywhere}
.pc-snip{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pc-snip b{color:var(--fg)}
.pc-meta{color:var(--muted);font-size:12.5px}
.chip.ftag{align-self:flex-start;padding:2px 10px;font-size:12px}
.post-head{padding:14px 16px 6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.post-head h2{margin:0;font-family:var(--font-display);font-size:20px;overflow-wrap:anywhere}
.media-up{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.media-tile{border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;text-align:left;color:var(--fg)}
.media-tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;transition:transform var(--t) var(--ease)}

.handup{position:absolute;right:2px;top:-4px;font-size:16px}
.vbtn.talk svg{width:18px;height:18px}
body.glass .post-card,body.glass .media-tile{background:var(--glass-tint);border-color:var(--glass-edge);box-shadow:inset 1px 1px 0 var(--glass-rim);border-radius:20px}
/* ---------- Epic profile: theme, decorations, effects, name styles ---------- */
.pcard,.pfull{position:relative;--pa:#8B7CF6;--pb:#4F8CFF}
.pcard.themed,.pfull.themed{--solid:color-mix(in srgb,var(--pa) 58%,#07070B);--fg:#F6F6FA;--muted:rgba(246,246,250,.74);--line:rgba(255,255,255,.16);--surface:rgba(0,0,0,.26);--bg:rgba(0,0,0,.32);--hover:rgba(255,255,255,.08);
  --pgrad:linear-gradient(172deg,color-mix(in srgb,var(--pa) 58%,#07070B) 0%,color-mix(in srgb,var(--pb) 46%,#07070B) 100%);
  background:var(--pgrad);color:var(--fg);border-color:color-mix(in srgb,var(--pa) 55%,transparent)}
body.glass .modal.wide .pcard.themed,body.glass .pfull.themed{background:var(--pgrad)}
body.glass .pfull:not(.themed){background:transparent}
.pcard.themed .psec,.pfull.themed .psec,.pcard.themed .badges,.pfull.themed .badges{background:rgba(0,0,0,.24);border-color:rgba(255,255,255,.12)}
.pcard .banner,.pfull .banner{position:relative;overflow:hidden}
.themed .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);background-size:250% 100%;animation:bshine calc(7s * var(--speed)) ease-in-out infinite}
@keyframes bshine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.badge-i{transition:transform var(--t) var(--ease)}
.badge-i:hover{transform:translateY(-3px) scale(1.15)}
/* avatar decorations */
.deco{position:relative;display:inline-grid;border-radius:50%;--ds:92px}
.deco>.av{position:relative;z-index:1}
.deco::before,.deco::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.deco-halo::before{inset:calc(var(--ds) * -.08);background:conic-gradient(from 0deg,var(--pa),var(--pb),#fff,var(--pa));animation:spin calc(6s * var(--speed)) linear infinite}
.deco-halo::after{inset:calc(var(--ds) * -.1);background:conic-gradient(from 0deg,var(--pa),var(--pb),#fff,var(--pa));filter:blur(10px);opacity:.75;animation:spin calc(6s * var(--speed)) linear infinite}
.deco-neon::before{inset:calc(var(--ds) * -.06);box-shadow:0 0 0 3px var(--pa),0 0 16px 4px var(--pa),0 0 34px 8px var(--pb);animation:neon calc(2.2s * var(--speed)) ease-in-out infinite alternate}
@keyframes neon{from{opacity:.65}to{opacity:1;filter:brightness(1.3)}}
.deco-llamas::before{inset:calc(var(--ds) * -.1);background:conic-gradient(#FF3D00,#FF8A3D,#FFD23D,#FF3D00,#FF8A3D,#FFD23D,#FF3D00);filter:blur(5px);animation:spin calc(3s * var(--speed)) linear infinite,flick .3s steps(2) infinite}
.deco-llamas::after{inset:calc(var(--ds) * -.04);background:radial-gradient(circle,rgba(255,138,61,.6),transparent 70%);animation:flick .45s steps(2) infinite}
@keyframes flick{50%{opacity:.75;transform:scale(1.03)}}
.deco-orbita::before{inset:calc(var(--ds) * -.12);border:2px dashed color-mix(in srgb,var(--pa) 75%,#fff);animation:spin calc(16s * var(--speed)) linear infinite}
.deco-orbita::after{width:calc(var(--ds) * .13);height:calc(var(--ds) * .13);top:50%;left:50%;margin:calc(var(--ds) * -.065);background:var(--pb);box-shadow:0 0 12px 2px var(--pb);z-index:2;animation:orbit calc(4s * var(--speed)) linear infinite}
@keyframes orbit{from{transform:rotate(0deg) translateX(calc(var(--ds) * .62))}to{transform:rotate(360deg) translateX(calc(var(--ds) * .62))}}
.deco-cristal::before{inset:calc(var(--ds) * -.07);background:conic-gradient(from 0deg,rgba(255,255,255,.95),rgba(150,215,255,.35),rgba(255,255,255,.95),rgba(205,170,255,.35),rgba(255,255,255,.95));animation:spin calc(9s * var(--speed)) linear infinite}
.deco-cristal::after{inset:calc(var(--ds) * -.07);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.7),transparent 35%);z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
/* name styles */
.nm-degradado{background:linear-gradient(90deg,var(--pa),var(--pb));-webkit-background-clip:text;background-clip:text;color:transparent!important}
.nm-brillo{text-shadow:0 0 14px var(--pa),0 0 2px #fff}
.nm-arcoiris{background:linear-gradient(90deg,#FF5F6D,#FFC371,#47E891,#4FC3F7,#B388FF,#FF5F6D);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rainbow calc(4s * var(--speed)) linear infinite}
@keyframes rainbow{to{background-position:200% 0}}
/* profile effects (particles) */
.pfx-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4;border-radius:inherit;container-type:size}
.pfx-layer i{position:absolute;display:block}
.fx-estrellas i{width:var(--s);height:var(--s);top:var(--y);background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px #fff);opacity:0;animation:twinkle var(--d) ease-in-out var(--dl) infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
.fx-nieve i{width:var(--s);height:var(--s);top:-12px;border-radius:50%;background:#fff;opacity:.85;animation:fall var(--d) linear var(--dl) infinite}
.fx-petalos i{width:var(--s);height:calc(var(--s) * .7);top:-14px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,#FFC1D9,#FF7AAE);opacity:.9;animation:fallspin var(--d) linear var(--dl) infinite}
@keyframes fall{from{transform:translate(0,0)}to{transform:translate(var(--dx),calc(100cqh + 24px))}}
@keyframes fallspin{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),calc(100cqh + 24px)) rotate(540deg)}}
.fx-brasas i{width:var(--s);height:var(--s);bottom:-12px;border-radius:50%;background:radial-gradient(circle,#FFE29A,#FF7A1A 60%,transparent 70%);box-shadow:0 0 8px #FF7A1A;animation:rise var(--d) ease-in var(--dl) infinite}
.fx-burbujas i{width:var(--s);height:var(--s);bottom:-16px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),transparent 45%);animation:rise var(--d) ease-in-out var(--dl) infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),calc(-100cqh - 24px));opacity:0}}
/* settings: effect pickers */
.fx-box{--pa:#8B7CF6;--pb:#4F8CFF}
.field label.toggle{font-size:inherit;letter-spacing:normal;text-transform:none;color:inherit;font-weight:inherit}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.fx-card{border:2px solid var(--line);background:var(--bg2);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;font-weight:600;font-size:13px;color:var(--fg)}
.fx-card.on{border-color:var(--accent)}
.fx-prev{position:relative;height:76px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(172deg,color-mix(in srgb,var(--pa) 50%,#07070B),color-mix(in srgb,var(--pb) 40%,#07070B));color:#fff}
.fx-prev .av{border:3px solid rgba(0,0,0,.35)}
body.glass .fx-card{background:var(--glass-tint);box-shadow:inset 1px 1px 0 var(--glass-rim)}
/* profile buttons over the card */
.pf-ctrl{position:absolute;top:10px;right:10px;z-index:6;display:flex;gap:6px}
.pf-ctrl .icon-btn{background:rgba(0,0,0,.5);color:#fff;border-radius:50%}
.pf-ctrl .icon-btn:hover{background:rgba(0,0,0,.7);color:#fff}
/* ---------- Full profile ---------- */
.modal.full{width:min(1000px,100%);height:min(86vh,780px);max-height:none}
.modal.full .modal-body{padding:0;height:100%;overflow:hidden;position:relative}
.pfull{height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--solid)}
.pfull .banner{height:200px;flex:none;background-size:cover;background-position:center}
.pf-body{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr)}
.pf-left{padding:0 24px 24px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative;z-index:2}
.pfull .idline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px}
.pfull .idline .dotsep{color:var(--muted)}
.pf-left .av-wrap{margin-top:-74px;display:block;width:max-content}
.pf-left .av{border:6px solid var(--solid)}
.pf-left .av .dot{border-color:var(--solid)}
.pf-left .av-wrap .thought{left:calc(100% + 4px);bottom:calc(100% - 58px)}
.pf-left h2{margin:4px 0 0;font-family:var(--font-display);font-size:28px;line-height:1.15;overflow-wrap:anywhere}
.pf-since{color:var(--muted);font-size:13.5px;display:flex;gap:6px;flex-wrap:wrap}
.pf-right{display:flex;flex-direction:column;min-height:0;min-width:0;border-left:1px solid var(--line)}
.pf-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 20px 0;border-bottom:1px solid var(--line)}
.pf-tab{border:0;background:none;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:2px solid transparent;min-height:44px;display:inline-flex;gap:6px;align-items:center}
.pf-tab:hover{color:var(--fg)}
.pf-tab.on{color:var(--fg);border-bottom-color:var(--fg)}
.pf-tab .cnt{font-size:12px;background:var(--surface);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.pf-panel{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px;display:flex;flex-direction:column;gap:14px}
.pf-panel h5{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pf-bio{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:15px}
.pf-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.pf-game{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.pf-game .game{width:64px;height:64px;border-radius:16px;font-size:22px}
.pf-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;color:var(--fg);min-height:56px}
button.pf-row:hover{background:var(--hover)}
.pf-row .txt{flex:1;min-width:0}
.pf-row .txt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-row .txt small{color:var(--muted)}
.pf-row .badge-i{width:40px;height:40px;border-radius:12px}
.pf-row .badge-i svg{width:22px;height:22px}
.pfull.enter .pf-left > *{animation:viewIn calc(var(--t) * 1.1) var(--ease) both}
.pfull.enter .pf-left > *:nth-child(2){animation-delay:calc(var(--t) * .06)}
.pfull.enter .pf-left > *:nth-child(3){animation-delay:calc(var(--t) * .12)}
.pfull.enter .pf-left > *:nth-child(4){animation-delay:calc(var(--t) * .18)}
.pfull.enter .pf-left > *:nth-child(n+5){animation-delay:calc(var(--t) * .24)}
.pfull.enter .pf-panel{animation:viewIn calc(var(--t) * 1.2) var(--ease) calc(var(--t) * .15) both}
.scrim:has(.modal.full){padding:16px}
@media (max-width:760px){
  .scrim:has(.modal.full){padding:0}
  .modal.full{width:100%;height:100%;border-radius:0;border:0}
  .pfull{overflow-y:auto;overflow-x:hidden}
  .pf-body{display:block;flex:none}
  .pfull .banner{height:150px}
  .pf-left{overflow:visible;padding:0 16px 16px}
  .pf-right{border-left:0;border-top:1px solid var(--line)}
  .pf-panel{overflow:visible;padding:16px}
  .pf-ctrl{top:max(10px,env(safe-area-inset-top,0px))}
}

.pf-tabs{position:relative}
.pf-tab{position:relative;z-index:1;border-bottom:0!important}
.pf-ind{position:absolute;left:0;top:0;width:0;height:0;z-index:0;pointer-events:none;box-shadow:inset 0 -2px 0 var(--fg)}

body.glass .pcard,body.glass .pfull{border-radius:26px;border:1px solid var(--glass-edge);
  background:linear-gradient(140deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05) 100%),var(--glass-tint);
  box-shadow:inset 1.5px 1.5px 0 var(--glass-rim),inset -1px -1px 0 rgba(255,255,255,.06)}
body.glass .pcard.themed,body.glass .pfull.themed,body.glass .modal.wide .pcard.themed{
  background:linear-gradient(140deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 70%,rgba(255,255,255,.06) 100%),
    linear-gradient(172deg,color-mix(in srgb,var(--pa) 46%,rgba(8,8,16,.42)) 0%,color-mix(in srgb,var(--pb) 40%,rgba(8,8,16,.48)) 100%)}
body.glass .modal.wide .pcard,body.glass .modal.full .pfull{border:0;border-radius:inherit}

body.glass .modal.wide,body.glass .modal.full{backdrop-filter:blur(calc(var(--lg-blur,26px) + 20px)) saturate(190%);-webkit-backdrop-filter:blur(calc(var(--lg-blur,26px) + 20px)) saturate(190%);background-color:rgba(10,10,18,.35)}
body[data-umbix="claro"].glass .modal.wide,body[data-umbix="claro"].glass .modal.full{background-color:rgba(255,255,255,.45)}
body.glass .pcard:not(.themed){--solid:transparent}
body.glass .pcard .av,body.glass .pf-left .av{background-clip:padding-box!important;border-color:rgba(255,255,255,.26);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 8px 24px rgba(0,0,0,.25)}
