/* level ring, missions, rewards */
.lvl-ring{--p:0;width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;align-content:center;color:#fff;position:relative;
  background:radial-gradient(closest-side,rgba(10,10,18,.55) 78%,transparent 80%),conic-gradient(#fff calc(var(--p) * 1%),rgba(255,255,255,.2) 0)}
.lvl-ring b{font-family:var(--font-display);font-size:28px;line-height:1}
.lvl-ring small{font-size:11px;opacity:.8}
.missions{display:flex;flex-direction:column;gap:8px}
.mission{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.mission.done{border-color:color-mix(in srgb,var(--online) 50%,var(--line))}
.mi-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mi-txt small{color:var(--muted)}
.mi-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mi-bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--online));transition:width .6s var(--ease)}
.mi-ok{display:inline-flex;align-items:center;gap:6px;color:var(--online);font-weight:700;font-size:14px}
.mission .btn[disabled]{opacity:.5;cursor:not-allowed}
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.reward{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);text-align:center}
.reward:not(.ok){opacity:.6}
.reward .rw-prev{width:100%;height:70px;border-radius:10px}
.reward small{color:var(--muted)}
.lvl-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pa,#8B7CF6),var(--pb,#4F8CFF));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.lvl-chip span{opacity:.8;font-weight:600}
.pc-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.streak{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:800;color:#FF8A3D;flex:none}
.streak svg{width:15px;height:15px;animation:flame 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flame{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12,1.06) rotate(3deg)}}
.streak-l{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.streak-l svg{width:16px;height:16px}
.streak-l b{color:#FF8A3D}
.side .item .streak{margin-left:auto}
body.glass .mission,body.glass .reward{background:var(--glass-tint);border-color:var(--glass-edge);border-radius:20px;box-shadow:inset 1.5px 1.5px 0 var(--glass-rim)}
body.glass .lvl-ring{box-shadow:0 0 0 1px rgba(255,255,255,.25),0 8px 24px rgba(0,0,0,.25)}
.missions .mission,.rewards .reward{animation:viewIn calc(var(--t) * 1.1) var(--ease) both}
.missions .mission:nth-child(2),.rewards .reward:nth-child(2){animation-delay:calc(var(--t) * .06)}.missions .mission:nth-child(3),.rewards .reward:nth-child(3){animation-delay:calc(var(--t) * .12)}.missions .mission:nth-child(4),.rewards .reward:nth-child(4){animation-delay:calc(var(--t) * .18)}.missions .mission:nth-child(5){animation-delay:calc(var(--t) * .24)}
body.glass .missions .mission,body.glass .rewards .reward{animation-name:lgIn}
body[data-anim="rebote"] .missions .mission,body[data-anim="rebote"] .rewards .reward{animation-name:bnIn;animation-timing-function:ease-out}
body[data-anim="minimal"] .missions .mission,body[data-anim="minimal"] .rewards .reward{animation-name:fadeIn}

/* ---------- Chat: tools, reactions, replies, polls ---------- */
.msg{position:relative}
.msg-tools{position:absolute;top:2px;right:12px;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--solid);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transform:translateY(4px) scale(.96);transition:opacity var(--t) ease,transform var(--t) var(--ease);z-index:3}
.msg:hover .msg-tools,.msg:focus-within .msg-tools,.msg.picking .msg-tools{opacity:1;pointer-events:auto;transform:none}
.msg-tools .icon-btn{width:32px;height:32px;min-height:32px}
.msg-tools .icon-btn svg{width:18px;height:18px}
@media (hover:none){ .msg-tools{opacity:1;pointer-events:auto;transform:none;top:4px;right:6px;background:transparent;border:0;box-shadow:none} .msg-tools .icon-btn{opacity:.55} }
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.react{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 9px;min-height:28px;font-size:14px;color:var(--fg)}
.react b{font-size:12px;color:var(--muted)}
.react.mine{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.react.mine b{color:var(--fg)}
.react-pick{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:max-content;max-width:100%;animation:popIn var(--t) var(--ease) both}
.react-pick .emoji-btn{font-size:20px;width:38px;height:38px;border:0;background:none;border-radius:10px}
.react-pick .emoji-btn:hover{background:var(--hover);transform:scale(1.15)}
.reply-q{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0 0 2px;color:var(--muted);font-size:13px;max-width:100%;text-align:left;overflow:hidden;white-space:nowrap}
.reply-q>span:last-child{overflow:hidden;text-overflow:ellipsis}
.rq-bar{width:18px;height:10px;border-left:2px solid var(--muted);border-top:2px solid var(--muted);border-top-left-radius:6px;flex:none;margin-top:6px;opacity:.6}
.reply-q b{font-size:13px;flex:none}
.msg.flash{animation:msgFlash 1.4s ease}
@keyframes msgFlash{0%,60%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
.replying{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 14px;margin-bottom:6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--muted);animation:fadeIn var(--t) ease both}
.replying b{color:var(--fg)}
.replying .icon-btn{width:28px;height:28px;min-height:28px}
.plus-btn{flex:none;width:34px;height:34px;min-height:34px;border-radius:50%;background:var(--hover)}
.composer form{padding-left:6px}
.slash{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);animation:fadeIn var(--t) ease both}
.slash[hidden]{display:none}
.slash-i{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;padding:8px 10px;border-radius:10px;color:var(--fg);text-align:left}
.slash-i:hover,.slash-i:focus-visible{background:var(--hover)}
.slash-i small{color:var(--muted)}
.poll{display:flex;flex-direction:column;gap:6px;margin-top:4px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);max-width:420px}
.poll-q{font-size:15px}
.poll-opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:40px;color:var(--fg);overflow:hidden;text-align:left}
.poll-opt.mine{border-color:var(--accent)}
.po-fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 26%,transparent);transition:width .6s var(--ease)}
.po-t,.po-n{position:relative}
.po-n{font-weight:700;font-size:13px;color:var(--muted)}
.roll{display:inline-flex;align-items:center;gap:10px;margin-top:4px;padding:8px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.die{width:34px;height:34px;flex:none;animation:dieIn .7s var(--ease) both}
.die.sm{width:22px;height:22px;animation:none}
@keyframes dieIn{0%{transform:rotate(-200deg) scale(.3)}70%{transform:rotate(15deg) scale(1.1)}100%{transform:none}}
.coin{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;flex:none;color:#7A4A00;font-size:18px;background:radial-gradient(circle at 35% 30%,#FFF1B8,#F0B232 60%,#B57A12);box-shadow:inset 0 0 0 2px rgba(122,74,0,.35);animation:coinIn .9s var(--ease) both}
.coin.sm{width:22px;height:22px;font-size:12px;animation:none}
@keyframes coinIn{0%{transform:rotateY(0) translateY(0)}40%{transform:rotateY(720deg) translateY(-14px)}100%{transform:rotateY(1080deg) translateY(0)}}
.plus-menu{display:flex;flex-direction:column;gap:6px}
.plus-menu .pf-row{width:100%;border-radius:14px}
.plus-menu .ht-ic{width:40px;height:40px}
body.glass .msg-tools,body.glass .react-pick,body.glass .slash,body.glass .replying{background:var(--glass-tint);border-color:var(--glass-edge);box-shadow:inset 1.5px 1.5px 0 var(--glass-rim),0 8px 24px rgba(0,0,0,.2);backdrop-filter:blur(var(--lg-blur,26px)) saturate(180%);-webkit-backdrop-filter:blur(var(--lg-blur,26px)) saturate(180%);border-radius:18px}
body.glass .react{background:var(--glass-tint);border-color:var(--glass-edge);box-shadow:inset 1px 1px 0 var(--glass-rim)}
body.glass .react.mine{background:color-mix(in srgb,var(--accent) 28%,transparent)}
body.glass .poll,body.glass .roll{background:var(--glass-tint);border-color:var(--glass-edge);border-radius:20px;box-shadow:inset 1.5px 1.5px 0 var(--glass-rim)}
body.glass .poll-opt{border-radius:14px;background:rgba(255,255,255,.06);border-color:var(--glass-edge)}
body.glass .plus-btn{background:var(--glass-tint);box-shadow:inset 1px 1px 0 var(--glass-rim)}
body.glass .react-pick{animation-name:lgIn}
body[data-anim="rebote"] .react-pick{animation-name:bnIn}
body[data-anim="ninguna"] .die,body[data-anim="ninguna"] .coin{animation:none}
.react.pop{animation:reactPop .45s var(--ease)}
@keyframes reactPop{40%{transform:scale(1.3)}}
body[data-anim="rebote"] .react.pop{animation:reactBounce .6s cubic-bezier(.68,-.55,.27,1.55)}
@keyframes reactBounce{30%{transform:scale(1.45) rotate(-8deg)}60%{transform:scale(.9) rotate(4deg)}}

/* ---------- Moments ---------- */
.moments{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:6px;scrollbar-width:none;align-items:flex-start}
.moments::-webkit-scrollbar{display:none}
.moment-it{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:none;position:relative}
.moment-it small{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moment-av{border:0;background:none;padding:0;position:relative;border-radius:50%}
.moment-av .ring{position:relative;display:grid;place-items:center;padding:3px;border-radius:50%;isolation:isolate}
.moment-av .ring::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:-1;background:conic-gradient(from 210deg,#F25C9A,#FF8A3D,#F0B232,#8B7CF6,#F25C9A)}
.moment-av .ring .av{border:3px solid var(--bg3)}
.moment-av.seen .ring::before{background:var(--line)}
.moment-av .ring.none{border:2px dashed var(--line)}
.moment-av .ring.none::before{display:none}
.moment-av .plus,.mini-add{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;font-size:16px;line-height:1;border:2px solid var(--bg3)}
.mini-add{right:4px;top:44px;bottom:auto;padding:0}
.moment-av:not(.seen) .ring::before{animation:spin calc(4s * var(--speed)) linear infinite}

.mo-empty{align-self:center;margin:0}
.moments .moment-it{animation:viewIn calc(var(--t) * 1.1) var(--ease) both}
.moments .moment-it:nth-child(2){animation-delay:calc(var(--t) * .06)}.moments .moment-it:nth-child(3){animation-delay:calc(var(--t) * .12)}.moments .moment-it:nth-child(4){animation-delay:calc(var(--t) * .18)}
body.glass .moments .moment-it{animation-name:lgIn}
body[data-anim="rebote"] .moments .moment-it{animation-name:bnIn;animation-timing-function:ease-out}
body[data-anim="minimal"] .moments .moment-it{animation-name:fadeIn}
body.glass .moment-av .ring .av{border-color:rgba(255,255,255,.25)}
.modal.story{width:min(420px,100%);height:min(760px,calc(100dvh - 32px));max-height:none;padding:0;background:#000;border:0;border-radius:22px}
.modal.story .modal-body{padding:0;height:100%}
.story{position:relative;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;color:#fff;overflow:hidden;border-radius:inherit}
.st-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.st-bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.st-bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.st-bar>span{display:block;height:100%;width:0;background:#fff}
.st-bar>span.full{width:100%}
.st-bar>span.run{animation:stRun linear forwards}
@keyframes stRun{to{width:100%}}
body[data-anim="ninguna"] .st-bar>span.run{animation-name:stRun!important}
.st-head{position:absolute;top:20px;left:10px;right:6px;display:flex;align-items:center;gap:8px;z-index:4;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.st-head .spacer{flex:1}
.st-head .nm{text-shadow:none}
.st-head small{opacity:.8}
.st-head .icon-btn{color:#fff}
.st-text{position:relative;z-index:2;margin:0 24px;text-align:center;font-family:var(--font-display);font-size:clamp(22px,6vw,30px);line-height:1.25;overflow-wrap:anywhere;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.st-text.cap{position:absolute;left:0;right:0;bottom:120px;font-size:18px;padding:10px 14px;margin:0 16px;border-radius:14px;background:rgba(0,0,0,.45)}
.st-nav{position:absolute;top:70px;bottom:110px;width:38%;border:0;background:none;z-index:2;padding:0}
.st-nav.prev{left:0}.st-nav.next{right:0}
.st-foot{position:absolute;left:0;right:0;bottom:0;padding:12px;display:flex;flex-direction:column;gap:10px;z-index:4;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.st-reacts{display:flex;gap:6px;justify-content:center}
.st-reacts .emoji-btn{font-size:24px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14)}
.st-reacts .emoji-btn:hover{transform:scale(1.15)}
.st-reply{display:flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.45);border-radius:99px;padding:4px 4px 4px 16px;background:rgba(0,0,0,.25)}
.st-reply input{flex:1;min-width:0;border:0;background:none;color:#fff;outline:none;padding:8px 0;font-size:16px}
.st-reply input::placeholder{color:rgba(255,255,255,.75)}
.st-reply .send{color:#fff}
.st-views{display:flex;align-items:center;gap:8px}
.st-faces{display:flex}.st-faces .av{margin-left:-6px;border:2px solid #000}
.st-foot .mini-btn{align-self:flex-start;background:rgba(255,255,255,.15);color:#fff}
body.glass .modal.story{border-radius:32px;box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.4),0 30px 80px rgba(0,0,0,.5)}
body.glass .st-reacts .emoji-btn,body.glass .st-reply{background:rgba(255,255,255,.14);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.4)}
.mk-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.mk-prev{width:180px;height:320px;border-radius:18px;flex:none;margin:0 auto;background-size:cover!important;background-position:center!important}
.mk-prev .st-text{font-size:18px;margin:0 12px}
.mk-side{flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px}
.mk-side textarea{width:100%;box-sizing:border-box}
body.glass .mk-prev{border-radius:26px;box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.4)}
@media (max-width:760px){
  .modal.story{width:100%;height:100dvh;border-radius:0}
  body.glass .modal.story{border-radius:0}
  .mk-prev{width:150px;height:266px}
}

/* ---------- Profile wall ---------- */
.wall-form{display:flex;gap:8px;margin-bottom:10px}
.wall-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;color:var(--fg)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.note-card{position:relative;display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--pa) 60%,#0A0A12),color-mix(in srgb,var(--pb) 50%,#0A0A12));box-shadow:0 6px 16px rgba(0,0,0,.2);rotate:-.6deg;animation:viewIn calc(var(--t) * 1.1) var(--ease) both}
.note-card:nth-child(even){rotate:.7deg}
.note-card .av{flex:none}
.nc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nc-txt p{margin:0;overflow-wrap:anywhere;font-size:14px}
.nc-txt small{opacity:.75;font-size:12px}
.note-card .icon-btn{color:#fff;width:28px;height:28px;min-height:28px;opacity:.7}
body.glass .note-card{border-radius:20px;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,0) 40%),linear-gradient(150deg,color-mix(in srgb,var(--pa) 45%,rgba(10,10,18,.35)),color-mix(in srgb,var(--pb) 40%,rgba(10,10,18,.4)));backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.45),0 8px 20px rgba(0,0,0,.2);animation-name:lgIn}
body[data-anim="rebote"] .note-card{animation-name:bnIn}
body[data-anim="minimal"] .note-card{animation-name:fadeIn}
body.glass .wall-form input{background:var(--glass-tint);border-color:var(--glass-edge);border-radius:18px}

/* ---------- Clips ---------- */
.clip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.clip-grid.sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.clip-card,.clip-add{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px;color:var(--fg);text-align:left;overflow:hidden;animation:viewIn calc(var(--t) * 1.1) var(--ease) both}
.clip-card:nth-child(2),.clip-add+.clip-card{animation-delay:calc(var(--t) * .05)}.clip-card:nth-child(3){animation-delay:calc(var(--t) * .1)}.clip-card:nth-child(4){animation-delay:calc(var(--t) * .15)}
.cc-thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:10px;background:#111 center/cover no-repeat;overflow:hidden}
.cc-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.cc-play{position:absolute;inset:0;margin:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.45);z-index:1;opacity:.85;transition:transform var(--t) var(--ease),opacity var(--t) ease}
.cc-play svg{width:18px;height:18px;margin-left:2px}
.clip-card:hover .cc-play,.clip-card:focus-visible .cc-play{transform:scale(1.15);opacity:1}
.clip-card:hover .cc-thumb{filter:brightness(1.08)}
.cc-dur{position:absolute;right:6px;bottom:6px;z-index:1;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:6px}
.cc-txt{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px;min-width:0}
.cc-txt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-txt small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip-add{align-items:center;justify-content:center;text-align:center;border-style:dashed;min-height:150px;gap:4px;background:transparent}
.clip-add small{color:var(--muted);font-size:12px}
.ca-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;margin-bottom:4px}
.ca-ic svg{width:20px;height:20px}
.clip-add:hover{background:var(--hover)}
.cnt-chip{font-size:12px;font-weight:700;color:var(--muted);background:var(--hover);padding:1px 8px;border-radius:99px}
.pc-clips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pc-clip{position:relative;aspect-ratio:16/10;border:0;border-radius:9px;background:#111 center/cover no-repeat;padding:0;overflow:hidden;transition:transform var(--t) var(--ease)}
.pc-clip:hover{transform:scale(1.05)}
.pc-clip .cc-dur{font-size:10px;right:4px;bottom:4px}
.pc-more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:18px}
.clip-form{display:flex;flex-direction:column;gap:12px}

/* ---------- Liquid Glass motion helpers ---------- */
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
function curDur(){ if(S.prefs.a11y&&S.prefs.a11y.reduce) return 0; return ({minimal:200,liquid:560,rebote:600,ninguna:0}[S.prefs.anim]||200)*(1/(+S.prefs.speed||1)); }
function curEase(){ return getComputedStyle(document.body).getPropertyValue('--ease').trim()||'ease'; }
function isLiquid(){ return S.prefs.anim==='liquid' && !reduceMotion.matches && !(S.prefs.a11y&&S.prefs.a11y.reduce); }
function canZoom(){ return isLiquid() && S.prefs.lg.zoom; }
/* The view grows out of the icon/box that was tapped */
function zoomFrom(el,r){
  if(!el||!r) return; const t=el.getBoundingClientRect(); if(!t.width||!t.height) return;
  const sx=Math.max(r.width/t.width,.04), sy=Math.max(r.height/t.height,.04);
  const dx=(r.left+r.width/2)-(t.left+t.width/2), dy=(r.top+r.height/2)-(t.top+t.height/2);
  const rad=getComputedStyle(el).borderRadius||'0px';
  if(!el.classList.contains('main')) el.style.animation='none';
  el.classList.add('zooming');
  const a=el.animate([
    {transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:0,filter:'blur(10px) saturate(1.6)',borderRadius:'48px'},
    {offset:.45,opacity:1,filter:'blur(2px) saturate(1.3)'},
    {transform:'none',opacity:1,filter:'none',borderRadius:rad}],
    {duration:curDur()*1.35,easing:curEase()});
  a.onfinish=a.oncancel=()=>{el.classList.remove('zooming');};
}
/* …and shrinks back into it when closing */
function zoomTo(el,r,done){
  if(!el||!r){done();return;} const t=el.getBoundingClientRect();
  const sx=Math.max(r.width/t.width,.04), sy=Math.max(r.height/t.height,.04);
  const dx=(r.left+r.width/2)-(t.left+t.width/2), dy=(r.top+r.height/2)-(t.top+t.height/2);
  el.style.animation='none';
  const a=el.animate([{transform:'none',opacity:1,filter:'none'},{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:0,filter:'blur(8px)',borderRadius:'48px'}],
    {duration:curDur()*.85,easing:'cubic-bezier(.55,0,.3,1)',fill:'forwards'});
  a.onfinish=done; a.oncancel=done;
}

const SELS=['.set-nav .nav-item.on','.hub-sibs .tab.on','#main .tabs .tab.on','.side .item.on','.settings .anim-grid .anim-card.on','.settings .themes .theme-card.on'];

function slideSel(before){
  if(!isLiquid()||!S.prefs.lg.slide) return;
  SELS.forEach((s,i)=>{
    const a=before[i], el=document.querySelector(s); if(!a||!el) return;
    const b=el.getBoundingClientRect(); if(Math.abs(a.top-b.top)<1&&Math.abs(a.left-b.left)<1) return;
    if(Math.abs(a.top-b.top)>700) return;
    const g=document.createElement('div'); g.className='sel-ghost'; g.style.borderRadius=getComputedStyle(el).borderRadius;
    Object.assign(g.style,{left:b.left+'px',top:b.top+'px',width:b.width+'px',height:b.height+'px'});
    document.body.appendChild(g); el.classList.add('sel-hold');
    const an=g.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px)`,width:a.width+'px',height:a.height+'px'},{transform:'none',width:b.width+'px',height:b.height+'px'}],

  const to={l:on.offsetLeft,t:on.offsetTop,w:on.offsetWidth,h:on.offsetHeight}, fr=ind._p; ind._p=to;
  Object.assign(ind.style,{left:to.l+'px',top:to.t+'px',width:to.w+'px',height:to.h+'px'});

/* ================= Levels, missions and rewards ================= */
function lvlInfo(xp){ const lvl=Math.floor(Math.sqrt(Math.max(0,xp)/50))+1, base=50*(lvl-1)**2, next=50*lvl**2; return {lvl,into:xp-base,need:next-base,pct:Math.min(100,(xp-base)/(next-base)*100)}; }
const MISSIONS=[['msg','Envía 5 mensajes',5,40],['react','Reacciona a 3 mensajes',3,30],['voice','Únete a un canal de voz',1,30],['moment','Comparte un momento',1,40],['sign','Firma el muro de un amigo',1,30]];

const dayKey=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function missions(){ const m=S.me.missions; if(!m||m.day!==dayKey()) S.me.missions={day:dayKey(),prog:{},claimed:[]}; return S.me.missions; }
function rewardLock(id){ const r=REWARDS.find(x=>x.id===id); return r&&lvlInfo(S.me.xp||0).lvl<r.lvl?r:null; }
function addXP(n,mission){
  if(mission){ const m=missions(), def=MISSIONS.find(x=>x[0]===mission);
    if(def&&(m.prog[mission]||0)<def[2]){ m.prog[mission]=(m.prog[mission]||0)+1; if(m.prog[mission]===def[2]) toast(`Misión completada: ${def[1]}`); } }
  const before=lvlInfo(S.me.xp||0).lvl; S.me.xp=(S.me.xp||0)+n; const after=lvlInfo(S.me.xp).lvl; save();
  if(after>before) setTimeout(()=>levelUp(after),400);
}
function levelUp(l){
  const r=REWARDS.find(x=>x.lvl===l);
  toast(r?`¡Subiste al nivel ${l}! Desbloqueaste: ${r.name}`:`¡Subiste al nivel ${l}!`);
  if(!curDur()) return; const box=document.createElement('div'); box.className='lvl-burst'; box.innerHTML=fxLayer('confeti',60)+`<div class="lb-card"><b>Nivel ${l}</b></div>`;
  document.body.appendChild(box); setTimeout(()=>box.remove(),2600);

function slashUpdate(val){ const el=$('#slash'); if(!el) return; if(!val.startsWith('/')||val.includes(' ')&&!val.startsWith('/encuesta')){ el.hidden=true; return; }
  const q=val.split(' ')[0].toLowerCase(), list=CMDS.filter(([c])=>c.startsWith(q)); if(!list.length){ el.hidden=true; return; }
  el.hidden=false; el.innerHTML=list.map(([c,d])=>`<button type="button" class="slash-i" data-action="slashPick" data-id="${c}"><b>${c}</b><small>${d}</small></button>`).join(''); trTree(el); }
function buildMsg(txt){
  const base={id:uid('m'),from:'me',t:Date.now()};
  if(REPLY){ base.reply={mid:REPLY.id,from:REPLY.from,text:REPLY.kind==='poll'?REPLY.q:(REPLY.text||'')}; }
  const low=txt.toLowerCase();
  if(low==='/dado') return {...base,kind:'dice',v:1+Math.floor(Math.random()*6),text:''};
  if(low==='/moneda') return {...base,kind:'coin',v:Math.random()<.5?'cara':'cruz',text:''};
  if(low.startsWith('/encuesta')){ const parts=txt.slice(9).split('|').map(x=>x.trim()).filter(Boolean);
    if(parts.length<3){ toast('Escribe: /encuesta Pregunta | opción 1 | opción 2'); return null; }
    return {...base,kind:'poll',q:parts[0].slice(0,140),opts:parts.slice(1,7).map(t=>({t:t.slice(0,60),v:[]})),text:''}; }
  if(txt.startsWith('/')){ toast('Ese comando no existe. Prueba /encuesta, /dado o /moneda.'); return null; }

  if(r.kind==='poll'){ m.q=d.q||''; m.opts=(d.opts||[]).map((t,i)=>({t,v:votes.filter(x=>x.option===i).map(x=>cid(x.user))})); }
  if(r.kind==='dice'||r.kind==='coin') m.v=d.v;
  if((r.reacts||[]).length) m.reacts=Object.fromEntries(r.reacts.map(x=>[x.emoji,x.users.map(cid)]));
  if(r.reply_to) m.reply={mid:r.reply_to,from:r.reply?cid(r.reply.author_id):'',text:r.reply?r.reply.content:''};
  return m;
}

}

async function onMsgChange(row){
  if(!row||!row.id) return;

  const known=full.channel_id?S.servers.some(s=>s.channels.some(c=>c.id===full.channel_id)):true;
  if(!known) return;
  const res=upsertMsg(full); if(!res) return;
  const here=curConvKey()===res.cv.key;
  if(res.cv.peer&&!S.users[res.cv.peer]){ try{ (await rpc('get_profiles',{p_ids:[sid(res.cv.peer)]})).forEach(p=>S.users[cid(p.id)]=userFromRow(p)); }catch(e){} }
  if(here&&!SET.open&&!SS.open) { rerenderMsgs(); if(res.isNew) animLast(); }
  else if(res.isNew&&res.m.from!=='me'){
    NET.unread[res.cv.key]=(NET.unread[res.cv.key]||0)+1; updateTitle();
    if(res.cv.peer){ const u=S.users[res.cv.peer]; if(u&&!(S.blocks||[]).includes(res.cv.peer)) toast(`${u.name}: ${(res.m.text||trs('Nuevo mensaje')).slice(0,60)}`); }

/* ---- pushing local changes (profile, friends, servers) ---- */
function scheduleSync(){ clearTimeout(NET.syncT); NET.syncT=setTimeout(runSync,450); }
function runSync(){
  clearTimeout(NET.syncT); NET.syncT=0;
  if(NET.syncing){ NET.again=true; return NET.syncP; }
  NET.syncing=true;
  NET.syncP=(async()=>{
    try{ await syncProfile(); await syncBlocks(); await syncFriends(); await syncServers(); }
    catch(e){ console.warn('sync',e); toast(netErr(e)); try{ await refreshAll(false); render(); }catch(e2){} }
    finally{ NET.syncing=false; if(NET.again){ NET.again=false; scheduleSync(); } }
  })();
  return NET.syncP;
}
async function uploadDataUrl(d){
  const key=d.length+':'+d.slice(-80); if(NET.upCache[key]) return NET.upCache[key];
  const mime=(d.match(/^data:([^;,]+)/)||[])[1]||'image/png', ext={'image/jpeg':'jpg','image/png':'png','image/gif':'gif','image/webp':'webp'}[mime]||'png';
  const blob=await (await fetch(d)).blob();
  if(blob.size>5*1048576) throw new Error('card_too_big');
  const path=`${NET.myId}/${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await NET.sb.storage.from('media').upload(path,blob,{contentType:mime,cacheControl:'31536000',upsert:false}); if(error) throw error;
  const url=NET.sb.storage.from('media').getPublicUrl(path).data.publicUrl; NET.upCache[key]=url; return url;
}
async function uploadDeep(obj,keys,skip){

async function doSignup(){

/* hold the opening animation until the data arrives */
function holdBoot(){ if(BOOT) BOOT.gate=true; }
function releaseBoot(){ if(!BOOT) return; BOOT.gate=false; if(BOOT.waiting){ BOOT.waiting=false; finishBoot(); } }
async function startApp(){
  const demo=()=>{ ONLINE=false; seedPresence(); render(); bootSplash(); if(netAvailable()){ const p=document.createElement('button'); p.className='demo-pill'; p.dataset.action='demoExit'; p.innerHTML='<span>Estás en la demo</span> <b>Crear cuenta</b>'; document.body.appendChild(p); try{ trTree(p); }catch(e){} } };
  try{ const l=localStorage.getItem('umbix-lang'); if(l) S.prefs.lang.lang=l;
    else if(!localStorage.getItem('umbix-online-v1')&&!localStorage.getItem(KEY)){ const n=(navigator.language||'').toLowerCase(), mp={en:'en-US',pt:'pt-BR',fr:'fr-FR',ja:'ja-JP'}, k=mp[n.slice(0,2)]||(n==='es-es'?'es-ES':null); if(k) S.prefs.lang.lang=k; } }catch(e){}
  document.documentElement.lang=langTag().slice(0,2);
  try{ applyPrefs(); }catch(e){}
  if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&!window.supabase){ demo(); setTimeout(()=>toast('No pudimos conectar con el servidor. Revisa tu internet y recarga la página.'),1500); return; }
  if(!netAvailable()) return demo();

  let demoFlag=false; try{ demoFlag=sessionStorage.getItem('umbix-demo')==='1'; }catch(e){}
  if(demoFlag) return demo();
  const recovery=/type=recovery/.test(location.hash);
  bootSplash(); holdBoot();
  NET.sb.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY'){ releaseBoot(); showAuth('reset'); } });
  let session=null; try{ session=(await NET.sb.auth.getSession()).data.session; }catch(e){}
  if(recovery){ showAuth('reset'); releaseBoot(); return; }
  if(session){ try{ await enterOnline(session); releaseBoot(); return; }catch(e){ console.warn(e); showAuth('login',netErr(e)); releaseBoot(); return; } }
  showAuth('login'); releaseBoot();
}

    const ctx=new (window.AudioContext||window.webkitAudioContext)(), src=ctx.createMediaStreamSource(st), an=ctx.createAnalyser(); an.fftSize=1024; src.connect(an);

function meterTick(){
  if(!(VC||micTesting)){ meterOn=false; micLevel=-100; paintMeters(); return; }

  if(micReal){ micReal.an.getFloatTimeDomainData(micReal.buf); let sum=0; for(const x of micReal.buf) sum+=x*x;
    micLevel=Math.max(-100,20*Math.log10(Math.sqrt(sum/micReal.buf.length)*(v.inVol/100)+1e-6)); }
  else { const talking=meTalk||(micTesting&&Math.sin(tt*2.1)>-.2);
    micLevel=talking?(-34+Math.abs(Math.sin(tt*9))*16+Math.random()*6)*(v.inVol>0?1:9):(-72+Math.random()*8); if(v.inVol===0) micLevel=-100; }

function createChannel(){
  const s=S.servers.find(x=>x.id===S.view.server); const name=chName(CC.type,$('#cc-n').value);
  if(name.length<1){ toast('Escribe un nombre para el canal.'); return; }
  const c={id:uid('c'),name,cat:$('#cc-c').value,type:CC.type,msgs:[],private:$('#cc-p').checked,roles:[]}; ensureChannel(c);
  if(c.type==='forum') c.posts=[]; s.channels.push(c); audit(s,`Creó el canal ${name} (${(CH_TYPES.find(x=>x[0]===c.type)||[])[1]})`);
  CC=null; closeModal();
  if(isVoiceType(c.type)){ save(); renderSide(); toast(`Canal ${name} creado. Tócalo para entrar.`); }
  else { Object.assign(S.view,{channel:c.id,voice:null,post:null}); render(); toast(`Canal #${name} creado`); }

  const q=SET.q.trim().toLowerCase(), u=S.me;
  let h=`<div class="set-me" id="setHead">${av(u,52)}<div class="txt"><b>${esc(u.name)}</b><button data-action="goSec" data-id="perfiles">Editar perfiles ${I.pencil}</button></div></div>

  let pendingGroup=null;
  SECTIONS.forEach(s=>{
    if(s.group){ pendingGroup=s.group; return; }
    const hay=(s.name+' '+(s.subs||[]).map(x=>x[1]).join(' ')).toLowerCase();
    if(q && !hay.includes(q)) return;
    if(pendingGroup){ h+=`<div class="nav-label">${pendingGroup}</div>`; pendingGroup=null; }

/* animate rows of a list from their old spots to the new ones */
function flipRows(sel,fn){
  const before={}; document.querySelectorAll(sel+' > [data-k]').forEach(r=>before[r.dataset.k]=r.getBoundingClientRect().top);
  fn();
  const d=Math.max(160,curDur()*.7);
  document.querySelectorAll(sel+' > [data-k]').forEach(r=>{ const b=before[r.dataset.k]; if(b===undefined) return; const dy=b-r.getBoundingClientRect().top;
    if(Math.abs(dy)>1&&curDur()) r.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:d,easing:curEase()}); });
}

/* image upload -> resized data URL */
function loadImage(file,w,h,cb,o={}){
  if(!file||!file.type.startsWith('image/')){ toast('Ese archivo no es una imagen.'); return; }
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
      const s=(o.contain?Math.min:Math.max)(w/img.width,h/img.height), dw=img.width*s, dh=img.height*s;
      x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh); cb(o.png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85)); };
    img.onerror=()=>toast('No pudimos leer esa imagen. Prueba con otra.'); img.src=r.result; };
  r.readAsDataURL(file);
}

  const row=h.closest('.b-row'), list=row&&row.parentElement; if(!row) return;

  const next=row.nextElementSibling, prev=row.previousElementSibling;

    if(curDur()) next.animate([{transform:`translateY(${b-a}px)`},{transform:'none'}],{duration:sp,easing:ez}); drag.startY+=(b-a); } }
  if(prev){ const r=prev.getBoundingClientRect(); if(e.clientY<r.top+r.height/2){ const b=r.top; list.insertBefore(row,prev); const a=prev.getBoundingClientRect().top;
    if(curDur()) prev.animate([{transform:`translateY(${b-a}px)`},{transform:'none'}],{duration:sp,easing:ez}); drag.startY-=(a-b); } }
